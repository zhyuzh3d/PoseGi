<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <title>PoseGi</title>
  <link rel="icon" href="./app/assets/icon.webp">
  <link rel="stylesheet" href="/__haminn/icons/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/viewport.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <div class="app-shell">
    <!-- 顶栏是一条**浮在 3D 场景上的毛玻璃卡片**:横向充满、圆角、带阴影。
         场景因此铺满整屏(卡片之外的顶栏区域是透明的,点得穿)。
         取景时上方留出的余量按卡片高度算过,人物头部不会被卡片压住。 -->
    <header class="topbar">
      <div class="topbar-card">
        <div class="brand">
          <span class="brand-mark">P</span>
          <strong>PoseGi</strong>
          <small id="app-version"></small>
        </div>
        <button class="icon-button" id="open-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="app-menu" data-zh="打开菜单" data-en="Open menu" data-i18n-attr="aria-label"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      </div>
      <div class="app-menu" id="app-menu" hidden>
        <button data-menu="newwork"><i class="fa-solid fa-plus" aria-hidden="true"></i><span data-zh="添加作品" data-en="Add artwork">添加作品</span></button>
        <div class="menu-divider"></div>
        <button data-menu="results"><i class="fa-solid fa-images" aria-hidden="true"></i><span data-zh="作品列表" data-en="Artwork list">作品列表</span></button>
        <div class="menu-divider"></div>
        <button data-menu="addmodel"><i class="fa-solid fa-plus" aria-hidden="true"></i><span data-zh="添加模型" data-en="Add model">添加模型</span></button>
        <button data-menu="models"><i class="fa-solid fa-cubes" aria-hidden="true"></i><span data-zh="模型列表" data-en="Model list">模型列表</span></button>
        <button data-menu="preferences"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span data-zh="软件设置" data-en="Preferences">软件设置</span></button>
        <div class="menu-divider"></div>
        <button data-menu="help"><i class="fa-solid fa-circle-question" aria-hidden="true"></i><span data-zh="使用说明" data-en="How to use">使用说明</span></button>
        <button data-menu="about"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span data-zh="软件信息" data-en="About">软件信息</span></button>
      </div>
    </header>

    <!-- 3D 场景占满顶栏以外的全部屏幕。工具一律收进底部 sheet,点按钮才出现。 -->
    <main class="stage" id="stage">
      <div class="stage-viewport" id="stage-viewport"></div>
      <div class="stage-fallback" id="stage-fallback" hidden></div>
      <p class="stage-caption" id="status-line" role="status"></p>
    </main>

    <!-- 自转滑杆:选中一个可转关节时,在按钮条上方浮出一行。
         为什么它必须是独立控件:自转(绕骨轴拧)是唯一"拖拽永远碰不到"的自由度 ——
         转轴就是骨头自己的轴,而骨的末端就在这根轴上,转它在屏幕上几乎不动
         (实测自转通道只有最强通道的 1~5%,而视口解算的丢弃线是 55%,它在第一道过滤里就被扔掉)。
         行程由该关节自己的 limit.y 决定(见 rig.jointRange),两端到头就是解剖边界,
         写入仍然走 poser.setJointAngle → rig.clampJoint 这一个收口点。 -->
    <div class="twist-bar" id="twist-bar" hidden>
      <div class="twist-head">
        <span class="twist-joint" id="twist-name"></span>
        <span class="twist-axis" id="twist-axis"></span>
      </div>
      <div class="twist-row">
        <span class="twist-bound" id="twist-min"></span>
        <input type="range" id="twist-range" step="1">
        <output class="twist-read" id="twist-value"></output>
      </div>
    </div>

    <!-- 底部常驻按钮。取景已并进「工具」,所以这里只有五个。 -->
    <div class="dock" id="dock">
      <button class="dock-button" id="open-poses" type="button"><i class="fa-solid fa-person" aria-hidden="true"></i><span data-zh="姿态" data-en="Pose">姿态</span></button>
      <button class="dock-button" id="open-joint" type="button"><i class="fa-solid fa-hand-pointer" aria-hidden="true"></i><span data-zh="选取" data-en="Pick">选取</span></button>
      <button class="dock-button" id="toggle-move" type="button"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i><span data-zh="工具" data-en="Tools">工具</span></button>
      <button class="dock-button" id="toggle-render" type="button" aria-pressed="false"><i class="fa-solid fa-palette" aria-hidden="true"></i><span data-zh="渲染" data-en="Render">渲染</span></button>
      <button class="dock-button" id="open-capture" type="button"><i class="fa-solid fa-camera" aria-hidden="true"></i><span data-zh="截图" data-en="Shot">截图</span></button>
      <button class="dock-button dock-button-primary" id="open-generate" type="button"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span data-zh="生成" data-en="Generate">生成</span></button>
    </div>
  </div>

  <!-- 竖屏兜底:清单里的 display.orientation=portrait 是正门,这层只在"宿主没锁住、
       又真的横过来了"的时候出现。刻意不用 hidden 属性控制显隐 —— 作者样式里的 display
       会盖过 [hidden],那正是 stage-fallback 踩过的坑,这里用媒体查询开关。 -->
  <div class="orientation-guard" id="orientation-guard">
    <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>
    <p data-zh="请把手机竖过来使用 PoseGi" data-en="Please rotate back to portrait to pose">请把手机竖过来使用 PoseGi</p>
  </div>

  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="sheet-handle"></div>
      <header class="modal-header">
        <div><span class="eyebrow" id="modal-eyebrow"></span><h2 id="modal-title"></h2></div>
        <button class="icon-button" data-close-modal data-zh="关闭" data-en="Close" data-i18n-attr="aria-label"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </header>
      <div class="modal-content" id="modal-content"></div>
      <footer class="modal-actions" id="modal-actions" hidden></footer>
    </section>
  </div>

  <div class="modal-layer confirm-layer" id="confirm-layer" hidden>
    <div class="modal-backdrop"></div>
    <section class="modal-sheet centered" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" tabindex="-1">
      <header class="modal-header"><h2 id="confirm-title"></h2></header>
      <div class="modal-content">
        <p id="confirm-message"></p>
        <div class="button-row">
          <button class="button button-secondary" id="confirm-cancel"></button>
          <button class="button button-primary" id="confirm-ok"></button>
        </div>
      </div>
    </section>
  </div>

  <!-- 成图全屏查看:独立的整屏层,双指放缩 / 拖动平移 / 双击复位,并在这里直接删除。
       它刻意不放进 .app-shell —— 那是个 flex 列,住在里面会被父级尺寸约束住。 -->
  <section class="render-preview" id="render-preview" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <div class="render-preview-stage" id="render-preview-stage">
      <img id="render-preview-image" alt="" draggable="false">
    </div>
    <div class="render-preview-hint" id="render-preview-zoom"></div>
    <div class="render-preview-tools" role="toolbar">
      <button class="icon-button" id="render-preview-reset" type="button" data-zh="复位图片" data-en="Reset image" data-i18n-attr="aria-label"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
      <button class="icon-button" id="render-preview-delete" type="button" data-zh="删除这张成图" data-en="Delete this image" data-i18n-attr="aria-label"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button>
      <button class="icon-button" id="render-preview-close" type="button" data-zh="关闭预览" data-en="Close preview" data-i18n-attr="aria-label"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
  </section>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="./vendor/three/three.min.js"></script>
  <script src="./vendor/three/OrbitControls.js"></script>
  <script src="./app/core/namespace.js"></script>
  <script src="./app/core/utils.js"></script>
  <script src="./app/core/i18n.js"></script>
  <script src="./app/core/runtime.js"></script>
  <script src="./app/core/models.js"></script>
  <script src="./app/assets/models/ikea.js"></script>
  <script src="./app/core/rig.js"></script>
  <script src="./app/core/ik.js"></script>
  <script src="./app/platform/haminn.js"></script>
  <script src="./app/services/assets.js"></script>
  <script src="./app/services/store.js"></script>
  <script src="./app/services/providers.js"></script>
  <script src="./app/services/translate.js"></script>
  <script src="./app/services/image-engine.js"></script>
  <script src="./app/components/ui.js"></script>
  <script src="./app/components/viewport.js"></script>
  <script src="./app/components/gallery.js"></script>
  <script src="./app/components/render-preview.js"></script>
  <script src="./app/components/settings.js"></script>
  <script src="./app/features/poser.js"></script>
  <script src="./app/features/figure.js"></script>
  <script src="./app/features/editor.js"></script>
  <script src="./app/features/self-test.js"></script>
  <script src="./app/app.js"></script>
</body>
</html>
