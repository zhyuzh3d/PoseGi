name: 功能建议
description: 为 PoseGi 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议!请先描述你要解决的问题,再说你希望的方案。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 3D 视口与渲染
        - 骨骼与关节
        - 摆姿交互与 IK
        - 姿态预设与镜像
        - 作品管理
        - 生图接口与参数
        - 界面与语言
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue,没有发现重复建议。
          required: true
        - label: 我愿意在需要时提交 Pull Request。
          required: false
