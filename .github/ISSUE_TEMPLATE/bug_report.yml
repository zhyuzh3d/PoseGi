name: 缺陷报告
description: 报告 PoseGi 的问题(3D 视口,摆姿,IK,姿态预设,作品,生图等)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈!请尽量把信息填全,方便定位。
        请不要粘贴真实 API Key,访问令牌,设备开发地址或隐私图片。
  - type: input
    id: version
    attributes:
      label: PoseGi 版本
      description: 见仓库 `hermit.json` 或应用内显示的名称。
      placeholder: "例如 0.1.2"
    validations:
      required: true
  - type: input
    id: hermit-version
    attributes:
      label: Hermit 版本
      placeholder: "例如 1.11.0 (versionCode 80)"
    validations:
      required: true
  - type: input
    id: android-webview
    attributes:
      label: Android 与 WebView 版本
      placeholder: "例如 Android 12,WebView Chrome 83"
    validations:
      required: true
  - type: dropdown
    id: webgl
    attributes:
      label: 设备是否支持 WebGL
      options:
        - 支持,3D 视口能正常显示
        - 不支持或不正常(应用给出了提示)
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 PoseGi,……
        2. 拖动某个关节 / 点某个按钮……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错信息或截图请一并贴上,截图请打码隐私内容。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 3D 视口(旋转 / 缩放 / 平移)
        - 拖动摆姿(连接杆旋转 / 节点移动)
        - 反向运动学(IK)
        - 自转滑杆
        - 姿态预设与镜像
        - 作品库与成图预览
        - 生图设置与模型卡
        - 生图提交与结果
        - 界面与语言
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue,没有发现重复。
          required: true
        - label: 我提交的内容不包含 API Key,令牌,设备开发地址或服务密码。
          required: true
        - label: 如涉及真实出图,我已确认自己配置的接口与网络环境正常。
          required: false
